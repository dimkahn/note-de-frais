app:
  # Justificatifs : <storage-dir>/<id>/original.<ext> (jamais modifié) et processed.jpg
  storage-dir: ${NDF_STORAGE_DIR:./storage}
  # Jeton d'administration, exigé dans l'en-tête X-Api-Token sur /api/admin/** ; vide = administration fermée
  api-token: ${NDF_API_TOKEN:}
  # Durée de validité d'une session (connexion e-mail / mot de passe), format ISO-8601 ou 30d
  session-ttl: ${NDF_SESSION_TTL:90d}
  # Offres : espace en ligne (originaux + rendus) et analyse IA par Claude
  plans:
    free:
      quota: 100MB
      ai-analysis: false
    premium:
      quota: 1GB
      ai-analysis: true
  # Connexion Google : identifiant client OAuth « web » (…apps.googleusercontent.com) ; vide = connexion Google fermée (503)
  google:
    client-id: ${NDF_GOOGLE_CLIENT_ID:}
  claude:
    enabled: ${NDF_CLAUDE_ENABLED:true}
    model: ${NDF_CLAUDE_MODEL:claude-opus-5-5}
    max-tokens: 16000

spring:
  application:
    name: note-de-frais
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    # Base fichier par défaut ; pour PostgreSQL : NDF_DB_URL=jdbc:postgresql://host/ndf + NDF_DB_USER / NDF_DB_PASSWORD
    url: ${NDF_DB_URL:jdbc:h2:file:./data/notedefrais;AUTO_SERVER=TRUE}
    username: ${NDF_DB_USER:sa}
    password: ${NDF_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}
