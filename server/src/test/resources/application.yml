app:
  storage-dir: ${java.io.tmpdir}/notedefrais-test-storage
  api-token: ""
  session-ttl: 1d
  plans:
    free:
      quota: 100MB
      ai-analysis: false
    premium:
      quota: 1GB
      ai-analysis: true
  claude:
    enabled: false
    model: claude-opus-5-5
    max-tokens: 16000
spring:
  datasource:
    url: jdbc:h2:mem:test;DB_CLOSE_DELAY=-1
  jpa:
    show-sql: false
